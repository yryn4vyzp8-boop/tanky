# Render Blueprint — deploys the TANKY API as a live web service.
#
# How to use: create a free account at render.com, "New" -> "Blueprint",
# connect the yryn4vyzp8-boop/tanky GitHub repo, Render reads this file
# automatically. No credentials are shared with anyone else in this process —
# it all happens in your own Render dashboard.
#
# Note: the free plan's disk is ephemeral (wiped on every deploy/restart), so
# the SQLite database resets to the seeded demo data each time. That's fine
# for a demo; a paid plan with a persistent disk mounted at
# apps/api/data would keep data across deploys.
#
# Stripe test-mode payments (optional): set these two env vars in the
# Render dashboard (Environment tab) — they aren't declared with values
# here since they're per-account secrets, not something to commit:
#   TANKY_PAYMENT_PROVIDER = stripe
#   STRIPE_SECRET_KEY      = sk_test_...   (Stripe Dashboard -> Developers -> API keys)
#   STRIPE_PUBLISHABLE_KEY = pk_test_...   (same page — not secret, served to the client)
# Leave TANKY_PAYMENT_PROVIDER unset (or "mock") to keep using the fully
# simulated MockPaymentProvider instead.
services:
  - type: web
    name: tanky-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build -w @tanky/domain && npm run build -w @tanky/api
    startCommand: npm run start -w @tanky/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: TANKY_DEMO_MODE
        value: "true"
      - key: TANKY_CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
